<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Vidrios 2E</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@700&display=swap" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
        crossorigin="anonymous"></script>

    <div class="row m-3">
        <div class="col-4">
            <img src="./assets/nada.png" width="280" height="125" class="mt-2">
        </div>
        <div class="col-5 text-end"> 
            <img src="./assets/2e.png" width="170" height="125" class="mt-2">
        </div>
        <div class="col-3 labelPresupuesto d-flex justify-content-end align-items-center">
            <h4>PRESUPUESTO</h4>
            <!-- <span>Documento no válido como factura</span> -->
        </div>
    </div>
    <div class="row m-3">
        <div class="col-4">La Paz 7347 - 2000 Rosario</div>
        <div class="col-4 text-center">Tel: 341 6930202 <br> 341 6744792</div>
        <div class="col-4">C.U.I.T. 20-31082344-9</div>
    </div>

    <div class="row m-3">
        <table class="col client-info">
            <tr>
                <td>Destinatario:</td>
                <td><input type="text" placeholder="Nombre del destinatario"></td>
            </tr>
            <tr>
                <td>Domicilio:</td>
                <td><input type="text" placeholder="Domicilio del destinatario"></td>
            </tr>
            <tr>
                <td>Teléfono:</td>
                <td><input type="text" placeholder="Teléfono del destinatario"></td>
            </tr>
            <tr>
                <td>Fecha:</td>
                <td><input type="date" placeholder="''"></td>
            </tr>
        </table>
    </div>

    <button onclick="agregarFila()" class="m-3 add-button">Agregar ítem</button>

    <div class="row m-3">
        <table class="budget">
            <thead>
                <tr>
                    <th>CANTIDAD</th>
                    <th>DESCRIPCIÓN</th>
                    <th>P. UNITARIO</th>
                    <th>TOTAL</th>
                    <th class="acciones">ACCIONES</th>
                </tr>
            </thead>
            <tbody id="tablaCuerpo">
                <!-- Filas dinámicas -->
            </tbody>
        </table>

        <footer class="w-100 m-3 d-flex justify-content-end align-items-center">
            <label class="text-end fw-bold mr-2">TOTAL: <span id="totalGeneral" class="fw-bold">$ 0,00</span></label>
        </footer>
    </div>

    <!-- Modal para nuevo ítem -->
    <div id="modalForm" class="no-print"
        style="display:none; position:fixed; top:20%; left:50%; transform:translateX(-50%); background:#fff; border:1px solid #000; padding:20px; z-index:1000;">
        <h3>Agregar Ítem</h3>
        <div class="row form">
            <label>Cantidad: <input type="number" id="inputCantidad"></label><br><br>
            <label>Descripción: <input type="text" id="inputDescripcion"></label><br><br>
            <label>Precio Unitario: <input type="number" id="inputPUnitario" step="0.01"></label><br><br>
        </div>
        <div class="d-flex justify-content-end align-items-center mt-2">
            <button onclick="confirmarAgregar()">Agregar</button>
            <button onclick="cerrarModal()" style="margin-left: 40px;">Cancelar</button>
        </div>
    </div>

    <script>
        // Array para almacenar los registros de los ítems
        let registros = [];

        function agregarFila() {
            document.getElementById("modalForm").style.display = "block";
        }

        function cerrarModal() {
            document.getElementById("modalForm").style.display = "none";
            limpiarCampos();
        }

        function limpiarCampos() {
            document.getElementById("inputCantidad").value = '';
            document.getElementById("inputDescripcion").value = '';
            document.getElementById("inputPUnitario").value = '';
        }

        function confirmarAgregar() {
            const cantidad = parseFloat(document.getElementById("inputCantidad").value);
            const descripcion = document.getElementById("inputDescripcion").value;
            const pUnitario = parseFloat(document.getElementById("inputPUnitario").value);

            if (isNaN(cantidad) || !descripcion || isNaN(pUnitario)) {
                alert("Por favor completá todos los campos correctamente.");
                return;
            }

            const total = cantidad * pUnitario;
            const fila = { cantidad, descripcion, pUnitario, total };
            registros.push(fila);
            renderizarTabla();
            cerrarModal();
        }

        function renderizarTabla() {
            const tablaCuerpo = document.getElementById("tablaCuerpo");
            tablaCuerpo.innerHTML = ""; // Limpiar la tabla antes de renderizar

            let totalGeneral = 0;

            registros.forEach((registro, index) => {
                const fila = document.createElement("tr");

                fila.innerHTML = `
                    <td>${registro.cantidad}</td>
                    <td>${registro.descripcion}</td>
                    <td>${registro.pUnitario.toFixed(2)}</td>
                    <td>$ ${registro.total.toFixed(2)}</td>
                    <td class="acciones"><button onclick="eliminarFila(${index})">Eliminar</button></td>
                `;
                tablaCuerpo.appendChild(fila);
                totalGeneral += registro.total;
            });
            document.getElementById('totalGeneral').textContent = `$ ${totalGeneral.toFixed(2)}`
        }

        function eliminarFila(index) {
            registros.splice(index, 1);
            renderizarTabla();
        }
    </script>

</body>

</html>
